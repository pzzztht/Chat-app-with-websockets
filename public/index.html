<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iChat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Outer Wrapper to keep title centered above the app -->
    <div class="app-container">

        <!-- App Title Header -->
        <h1 class="title">iChat 💬</h1>

        <!-- Chat Container -->
        <div id="chat-main">

            <!-- Left Sidebar Panel -->
            <div class="sidebar">

                <!-- Logged User Profile Bar -->
                <div class="user-profile">
                    <div class="user-profile-info">
                        <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=ppp" alt="Avatar">
                        <span id="logged-username">ppp</span>
                    </div>
                    <button id="logout-btn" onclick="logout()" title="Logout">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
                            fill="currentColor">
                            <path
                                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
                        </svg>
                        <span>Logout</span>
                    </button>
                </div>

                <!-- Search Input -->
                <div class="search-container">
                    <input type="text" id="user-search-input" placeholder="Search users or chats...">
                </div>

                <!-- Conversations Section -->
                <div class="conversations-header">CONVERSATIONS</div>
                <ul id="conversations-list" class="conversations-list">
                    <!-- Conversations render dynamically here -->
                </ul>

                <!-- Footer Client Count -->
                <div class="clients-total-footer" id="clients-total">Total Clients: 1</div>
            </div>

            <!-- Right Active Chat Window -->
            <div id="chat-window" class="hidden">
                <div class="chat-header">
                    <button class="back-btn" onclick="showSidebar()">← Back</button>
                    <h3 id="current-chat-title">Group Chat</h3>
                </div>

                <ul id="message-container">
                    <!-- Chat messages render dynamically here -->
                </ul>

                <form id="message-form">
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn" aria-label="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
                            fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>

</html>
